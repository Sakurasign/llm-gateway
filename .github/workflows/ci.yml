name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B clean package

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          retention-days: 7

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-console
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gateway-console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build:only

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the Compose stack
        run: |
          export MYSQL_ROOT_PASSWORD="$(openssl rand -hex 24)"
          export RABBIT_PASS="$(openssl rand -hex 24)"
          export ADMIN_USERNAME=ci-admin
          export ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export ADMIN_JWT_SECRET="$(openssl rand -hex 32)"
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 3 --max-time 5 \
            http://127.0.0.1:18081/actuator/health
          curl --fail --silent --show-error http://127.0.0.1:18081/ | grep -F '<title>Sakura Gateway</title>'
